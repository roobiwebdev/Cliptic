name: CI

# Every PR into dev/main must pass before merge (enforced by branch protection).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy, non-secret env so the required-env gate passes and Prisma/Next can
    # build without connecting to a real database. Real secrets never touch CI.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/cliptic
      BETTER_AUTH_SECRET: ci-dummy-secret-do-not-use
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate + generate
        run: pnpm prisma validate && pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
